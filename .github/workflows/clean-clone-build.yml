name: clean-clone-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact source and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1.12.3
        with:
          release: 14.2.Rel1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned Python build dependencies
        run: python3 -m pip install -r tools/requirements-build.txt

      - name: Smoke-test every Python entry point
        run: |
          python3 -m compileall -q tools
          for tool in tools/*.py; do
            python3 "$tool" --help >/dev/null
          done

      - name: Preflight and compile every firmware application
        run: >-
          python3 tools/build_all_firmware.py
          --build-root build/ci
          --build-type Release
          --jobs 4
          --strict-toolchain

      - name: Record build evidence
        run: |
          git status --short
          git submodule status --recursive
          arm-none-eabi-gcc --version
          cat build/ci/build_manifest.json
          sha256sum build/ci/*/STM32_deploy.hex build/ci/*/STM32_deploy.bin

      - name: Reject generated or host-specific source state
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          if strings build/ci/*/STM32_deploy.elf build/ci/*/STM32_deploy.bin |
            grep -F "$GITHUB_WORKSPACE"; then
            echo "firmware contains the GitHub runner checkout path"
            exit 1
          fi

      - name: Upload all directly flashable firmware
        uses: actions/upload-artifact@v4
        with:
          name: STM32_deploy-all-applications-${{ github.sha }}
          path: |
            build/ci/build_manifest.json
            build/ci/*/STM32_deploy.hex
            build/ci/*/STM32_deploy.bin
          if-no-files-found: error
